[workspace]
members = [
  "crates/ctx-cli",
  "crates/ctx-core",
  "crates/ctx-config",
  "crates/ctx-intake",
  "crates/ctx-prune",
  "crates/ctx-ast",
  "crates/ctx-semantic",
  "crates/ctx-pack",
  "crates/ctx-graph",
  "crates/ctx-mcp",
  "crates/ctx-hooks",
  "crates/ctx-telemetry",
  "crates/ctx-token",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["CTX contributors"]
repository = "https://github.com/example/context-engine"

[workspace.dependencies]
anyhow = "1.0"
assert_cmd = "2.0"
camino = "1.1"
clap = { version = "4.5", features = ["derive"] }
predicates = "3.1"
regex = "1.12"
rusqlite = { version = "0.37", features = ["bundled", "modern_sqlite"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.23"
thiserror = "2.0"
toml = "0.9"
tracing = "0.1"
walkdir = "2.5"
